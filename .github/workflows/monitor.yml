name: Monitor Cineplex seats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: cineplex-seat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out monitor
        uses: actions/checkout@v5

      - name: Check watched seats
        env:
          CINEPLEX_SUBSCRIPTION_KEY: ${{ secrets.CINEPLEX_SUBSCRIPTION_KEY }}
        run: node monitor.mjs

      - name: Notify about newly available seats
        env:
          ALERT_ASSIGNEE: sarv19
          GITHUB_TOKEN: ${{ github.token }}
        run: node notify.mjs

      - name: Persist monitor state
        run: |
          git config user.name "cineplex-seat-watch[bot]"
          git config user.email "cineplex-seat-watch[bot]@users.noreply.github.com"
          git add .monitor-state.json .seat-map-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seat monitor state"
            git push
          fi

      - name: Stop after the final showtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("alerts.json","utf8")); process.exit(r.allExpired ? 0 : 1)'; then
            gh workflow disable monitor.yml
          fi
